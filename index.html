<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><meta name="apple-mobile-web-app-capable" content="yes"><title>JARVIS</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><style>:root{--b:#050507;--p:#101015;--l:#303039;--r:#ef3035;--m:#a4a4ad;--w:#f7f7f8}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 42%,#26090b 0,#0a0709 29%,var(--b) 65%);color:var(--w);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}.shell{max-width:650px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l)}.brand{font-size:18px;font-weight:bold;letter-spacing:.25em}.dot{display:inline-block;width:7px;height:7px;background:var(--r);border-radius:50%;box-shadow:0 0 13px var(--r);margin-left:7px}.mode,.online{font-size:9px;color:var(--m)}.online:before{content:"";display:inline-block;width:6px;height:6px;margin-right:6px;border-radius:50%;background:#55e599;box-shadow:0 0 8px #55e599}.stage{flex:1;min-height:450px;display:flex;flex-direction:column;align-items:center;justify-content:center}.hint{color:var(--m);font-size:9px;margin-bottom:30px}.orb{border:0;border-radius:50%;width:min(56vw,260px);height:min(56vw,260px);color:white;cursor:pointer;background:radial-gradient(circle at 40% 33%,#ff8585,#ee3036 22%,#8b1317 57%,#260306 78%);box-shadow:0 0 0 1px #ff949455,0 0 48px #ed3035a0,0 0 118px #750e1266;transition:.25s}.orb:active,.orb.on{transform:scale(.95);box-shadow:0 0 0 1px white,0 0 68px #ff343a,0 0 145px #8f1519}.orb b{font:700 18px ui-monospace,monospace;letter-spacing:.22em}.orb small{display:block;font-size:8px;color:#ffd8d8;margin-top:7px}.voice{height:22px;margin-top:45px;color:#efb2b2;font-size:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.control{min-height:65px;text-align:left;border:1px solid var(--l);background:#0d0d11;color:var(--w);padding:13px;cursor:pointer}.control:hover{border-color:#ef303599}.control span{display:block;font-size:8px;color:var(--m);margin-bottom:5px}.control strong{font-size:11px}.badge{float:right;background:var(--r);border-radius:9px;padding:1px 6px;font-size:9px}.meta{display:flex;justify-content:space-between;color:#707079;font-size:8px;margin-top:15px}.sheet{position:fixed;z-index:3;bottom:0;left:0;right:0;min-height:46dvh;background:var(--p);border-top:1px solid #3b3b44;padding:20px max(20px,calc((100% - 610px)/2)) calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);transition:.25s}.sheet.show{transform:translateY(0)}.close{float:right;border:0;background:transparent;color:var(--m);font-size:20px}.sheet h2{font-size:12px;letter-spacing:.16em;margin:0 0 18px}.feed{max-height:35dvh;overflow:auto;font:14px/1.55 system-ui,sans-serif;letter-spacing:0;color:#d7d7dd}.feed p{margin:0;padding:11px 0;border-bottom:1px solid #292931}.feed b{color:#ff676b;font:10px ui-monospace,monospace;letter-spacing:.1em}.ask{display:flex;gap:8px;margin-top:14px}.ask input{flex:1;padding:13px;color:white;border:1px solid #41414a;background:#08080b;font:14px system-ui}.ask button{border:0;background:var(--r);color:white;font-weight:bold;padding:0 16px}.notice{border-left:2px solid var(--r);background:#191014;padding:10px 12px}@media(min-width:560px){.grid{grid-template-columns:repeat(5,1fr)}.control strong{font-size:10px}}</style></head><body><main class="shell"><header class="top"><div class="brand">JARVIS<i class="dot"></i></div><div class="mode">MODE // HOME</div><div class="online">ONLINE</div></header><section class="stage"><div class="hint">TAP CORE TO SPEAK</div><button class="orb" id="orb"><b>MASTER</b><small>VOICE CORE</small></button><div class="voice" id="voice">Standing by, sir.</div></section><nav class="grid"><button class="control" data-v="signals"><span>SYSTEM</span><strong>SIGNALS <i class="badge">03</i></strong></button><button class="control" data-v="missions"><span>QUEUE</span><strong>MISSIONS</strong></button><button class="control" data-v="ask"><span>INPUT</span><strong>ASK</strong></button><button class="control" data-v="approvals"><span>SAFETY</span><strong>APPROVALS</strong></button><button class="control" data-v="calls"><span>COMMS</span><strong>CALLS</strong></button></nav><div class="meta"><span>LOCAL-FIRST SHELL</span><span>V0.1</span></div></main><section class="sheet" id="sheet"><button class="close" id="close">×</button><h2 id="title">ASK JARVIS</h2><div class="feed" id="feed"></div><form class="ask" id="form"><input id="question" placeholder="Type an instruction…" autocomplete="off"><button>ASK</button></form></section><script>const v={signals:["SIGNALS","<p><b>03 ACTIVE</b><br>Jarvis PWA shell is online.</p><p><b>PRIVACY</b><br>No accounts or personal data are connected in this build.</p>"],missions:["MISSIONS","<p>No missions loaded. Connected Jarvis will place work here.</p>"],ask:["ASK JARVIS","<p>Tell me what needs doing. Consequential actions will always ask first.</p>"],approvals:["APPROVALS","<p class=notice><b>APPROVAL-FIRST</b><br>Calls, messages, spending, bookings, cancellations and deletion remain behind an explicit yes.</p>"],calls:["CALLS","<p>No calling action is connected. A future Android layer will handle permissioned calling.</p>"]};const s=document.querySelector("#sheet"),t=document.querySelector("#title"),f=document.querySelector("#feed"),o=document.querySelector("#orb"),voice=document.querySelector("#voice");function open(x){t.textContent=v[x][0];f.innerHTML=v[x][1];s.classList.add("show");document.querySelector("#question").focus()}document.querySelectorAll("[data-v]").forEach(x=>x.onclick=()=>open(x.dataset.v));document.querySelector("#close").onclick=()=>s.classList.remove("show");o.onclick=()=>{o.classList.toggle("on");voice.textContent=o.classList.contains("on")?"Listening… tap again to stop.":"Standing by, sir."};document.querySelector("#form").onsubmit=e=>{e.preventDefault();let q=document.querySelector("#question");if(!q.value.trim())return;let p=document.createElement("p"),b=document.createElement("b");b.textContent="MASTER";p.append(b,document.createElement("br"),q.value);f.append(p);let r=document.createElement("p"),rb=document.createElement("b");rb.textContent="JARVIS";r.append(rb,document.createElement("br"),"Received. The installable shell is ready for the connected assistant layer next.");f.append(r);q.value="";f.scrollTop=f.scrollHeight};if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");</script></body></html>
